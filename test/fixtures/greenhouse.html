<!doctype html><html><head><title>Job Application for Data Scientist at Acme</title></head><body>
<h1>Data Scientist</h1>
<form id="application_form">
<div class="field"><label for="first_name">First Name *</label><input id="first_name" name="job_application[first_name]" required></div>
<div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="job_application[last_name]" required></div>
<div class="field"><label for="email">Email *</label><input id="email" type="email" name="job_application[email]" required></div>
<div class="field"><label for="phone">Phone</label><input id="phone" type="tel" name="job_application[phone]"></div>
<div class="field"><label>Resume/CV *</label><input type="file" id="resume"></div>
<div class="field"><label for="q1">LinkedIn Profile</label><input id="q1" name="job_application[answers_attributes][0][text_value]"></div>
<div class="field"><label for="q2">Website</label><input id="q2" name="job_application[answers_attributes][1][text_value]"></div>
<div class="field"><label for="q3">Are you legally authorized to work in the United States? *</label>
  <select id="q3" required><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select></div>
<div class="field"><label for="q4">Will you now or in the future require sponsorship for employment visa status (e.g. H-1B)? *</label>
  <select id="q4" required><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select></div>
<div class="field"><label for="q5">Which professional certifications do you hold?</label><textarea id="q5"></textarea></div>
<div class="field"><label for="q6">What is your favorite dataset and why? *</label><textarea id="q6" required></textarea></div>
<div class="field"><label for="gender">Gender</label><select id="gender"><option value="">Please select</option><option value="1">Male</option><option value="2">Female</option><option value="3">Decline To Self Identify</option></select></div>
<div class="field"><label for="vet">Veteran Status</label><select id="vet"><option value="">Please select</option><option>I am a protected veteran</option><option>I am not a protected veteran</option><option>I don't wish to answer</option></select></div>
<button type="submit">Submit Application</button>
</form>
<script>window.events=[];document.addEventListener('input',e=>events.push(e.target.id),true);</script>
</body></html>
